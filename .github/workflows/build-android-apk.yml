name: Build NordFlora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Capacitor Android binary assets
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path("node_modules/@capacitor/cli/assets/android-template.tar.gz")
          android_dir = Path("android")
          if archive.exists():
              with tarfile.open(archive, "r:gz") as tf:
                  for member in tf.getmembers():
                      if not member.isfile():
                          continue
                      rel = Path(member.name)
                      if rel.suffix in {".jar", ".png"} or rel.name in {"gradlew", "gradlew.bat"}:
                          target = android_dir / rel
                          needs_restore = (not target.exists()) or target.stat().st_size == 0
                          if not needs_restore and rel.suffix == ".png":
                              needs_restore = target.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n"
                          if not needs_restore and rel.suffix == ".jar":
                              needs_restore = target.read_bytes()[:2] != b"PK"
                          if needs_restore:
                              target.parent.mkdir(parents=True, exist_ok=True)
                              with tf.extractfile(member) as src:
                                  target.write_bytes(src.read())
                              if rel.name == "gradlew":
                                  target.chmod(0o755)
                              print(f"Restored template binary: {target}")
          PY

      - name: Configure optional google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Installed android/app/google-services.json from GitHub Secret."
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Installed android/app/google-services.json from repository root."
          else
            echo "NOTE: google-services.json not found. Debug APK will still build; add google-services.json (or GOOGLE_SERVICES_JSON secret) for native Google sign-in."
          fi

      - name: Type-check and build web app
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: 'false'
        run: npx cap sync android

      - name: Cache Android debug keystore for stable SHA-1
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: nordflora-android-debug-keystore-v1

      - name: Ensure Android debug keystore exists
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Restored ~/.android/debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new ~/.android/debug.keystore (cached for future runs)."
          else
            echo "Using cached ~/.android/debug.keystore."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          echo "===== Android debug signing certificate (add this SHA-1 to Firebase) ====="
          gradle signingReport --no-daemon
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          gs_file = Path("app/google-services.json")
          apk_sha1 = ""
          if apk.exists():
              out = subprocess.check_output(["keytool", "-printcert", "-jarfile", str(apk)], text=True, stderr=subprocess.STDOUT)
              m = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", out)
              if m:
                  apk_sha1 = m.group(1).upper()
                  print(f"APK signing SHA-1: {apk_sha1}")
          if gs_file.exists():
              try:
                  gs = json.loads(gs_file.read_text())
                  clients = gs.get("client", [])
                  oauth = clients[0].get("oauth_client", []) if clients else []
                  has_web = any(c.get("client_type") == 3 for c in oauth)
                  hashes = []
                  for c in oauth:
                      h = c.get("android_info", {}).get("certificate_hash")
                      if h:
                          formatted = ":".join(h.upper()[i:i+2] for i in range(0, len(h), 2))
                          hashes.append(formatted)
                  print(f"google-services.json has Web Client ID (type 3): {has_web}")
                  print(f"google-services.json Android SHA-1 entries: {hashes}")
                  if apk_sha1 and apk_sha1 not in hashes:
                      print(f"WARNING: APK SHA-1 ({apk_sha1}) is NOT listed in google-services.json. Add {apk_sha1} in Firebase Console -> omega-fusion-ngt36 -> com.nordflora.app!")
              except Exception as exc:
                  print(f"Could not inspect google-services.json: {exc}")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NordFlora-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
