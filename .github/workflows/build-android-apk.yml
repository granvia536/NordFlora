name: Build NordFlora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure Capacitor Android binary assets
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path("node_modules/@capacitor/cli/assets/android-template.tar.gz")
          android_dir = Path("android")
          if archive.exists():
              with tarfile.open(archive, "r:gz") as tf:
                  for member in tf.getmembers():
                      if not member.isfile():
                          continue
                      rel = Path(member.name)
                      if rel.suffix in {".jar", ".png"} or rel.name in {"gradlew", "gradlew.bat"}:
                          target = android_dir / rel
                          needs_restore = (not target.exists()) or target.stat().st_size == 0
                          if not needs_restore and rel.suffix == ".png":
                              needs_restore = target.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n"
                          if not needs_restore and rel.suffix == ".jar":
                              needs_restore = target.read_bytes()[:2] != b"PK"
                          if needs_restore:
                              target.parent.mkdir(parents=True, exist_ok=True)
                              with tf.extractfile(member) as src:
                                  target.write_bytes(src.read())
                              if rel.name == "gradlew":
                                  target.chmod(0o755)
                              print(f"Restored template binary: {target}")
          PY

      - name: Configure optional google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Installed android/app/google-services.json from GitHub Secret."
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Installed android/app/google-services.json from repository root."
          else
            echo "NOTE: google-services.json not found. Debug APK will still build; add google-services.json (or GOOGLE_SERVICES_JSON secret) for native Google sign-in."
          fi

      - name: Type-check and build web app
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: 'false'
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          echo "===== Android debug signing certificate (add this SHA-1 to Firebase) ====="
          gradle signingReport --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NordFlora-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
