name: Build NordFlora Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Configure optional google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Installed android/app/google-services.json from GitHub Secret."
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Installed android/app/google-services.json from repository root."
          else
            echo "NOTE: google-services.json not found. Debug APK will still build; add google-services.json (or GOOGLE_SERVICES_JSON secret) for native Google sign-in."
          fi

      - name: Type-check and build web app
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: 'false'
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          echo "===== Android debug signing certificate (add this SHA-1 to Firebase) ====="
          ./gradlew signingReport

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NordFlora-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
